server:
  port: 8080

spring:
  application:
    name: shop
  config:
    # Secrets du poste de dev (ex. app.stripe.secret-key) — fichier
    # backend/application-local.yml, ignoré par git, facultatif.
    import: optional:file:./application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

app:
  jwt:
    # ⚠️ valeur par défaut pour le dev local uniquement — à surcharger via
    # la variable d'env JWT_SECRET dans tout environnement partagé/déployé.
    secret: ${JWT_SECRET:local-dev-only-change-me-32-bytes-minimum-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 min — court car un refresh token existe (rotation, étape 10)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 jours, token opaque stocké hashé en base
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:5}
    window-ms: ${RATE_LIMIT_WINDOW_MS:60000} # 5 tentatives / minute / IP sur /api/auth/login et /register
  stripe:
    # Clé secrète Stripe (sk_test_... en dev) — jamais commitée, toujours via
    # la variable d'env STRIPE_SECRET_KEY. Vide = paiement par carte désactivé
    # (le checkout répond 503).
    secret-key: ${STRIPE_SECRET_KEY:}
    currency: ${STRIPE_CURRENCY:eur}
    # Où Stripe renvoie le client après le paiement (success/cancel).
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    reconcile-interval-ms: ${STRIPE_RECONCILE_INTERVAL_MS:300000} # 5 min
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:true}
      email: ${SEED_ADMIN_EMAIL:admin@shop.local}
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # health/info publics (voir SecurityConfig) ; le reste (metrics,
        # prometheus) est réservé aux admins — pas de fuite de détails
        # d'infra vers des utilisateurs non authentifiés.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Shop API
    description: API e-commerce multi-catégories (monolithe modulaire)
