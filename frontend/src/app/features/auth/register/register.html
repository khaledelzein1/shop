<div class="auth-page">
  <div class="card auth-card">
    <h1>Créer un compte</h1>

    @if (errorMessage()) {
      <div class="alert alert--error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="firstName">Prénom</label>
        <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
      </div>

      <div class="form-field">
        <label for="lastName">Nom</label>
        <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="form-error">Email invalide</span>
        }
      </div>

      <div class="form-field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="form-error">8 caractères minimum</span>
        }
      </div>

      <button type="submit" class="btn" [disabled]="loading()">
        {{ loading() ? "Création..." : "Créer mon compte" }}
      </button>
    </form>

    <p class="auth-switch">Déjà inscrit ? <a routerLink="/login">Connecte-toi</a></p>
  </div>
</div>
