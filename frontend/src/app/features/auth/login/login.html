<div class="auth-page">
  <div class="card auth-card">
    <h1>Log in</h1>

    @if (errorMessage()) {
      <div class="alert alert--error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="login">Email or username</label>
        <input id="login" type="text" formControlName="login" autocomplete="username" autocapitalize="none" />
        @if (form.controls.login.touched && form.controls.login.invalid) {
          <span class="form-error">Email or username required</span>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="form-error">Password required</span>
        }
      </div>

      <button type="submit" class="btn" [disabled]="loading()">
        {{ loading() ? "Logging in..." : "Log in" }}
      </button>
    </form>

    <p class="auth-switch">Don't have an account yet? <a routerLink="/register">Sign up</a></p>
  </div>
</div>
