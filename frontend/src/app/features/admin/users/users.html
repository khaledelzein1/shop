<h1>Users</h1>

<div class="filters-bar">
  <div class="form-field">
    <label for="q">Search</label>
    <input id="q" type="text" [(ngModel)]="searchQuery" (keyup.enter)="search()" placeholder="Email..." />
  </div>
  <button type="button" class="btn btn--secondary" (click)="search()">Search</button>
</div>

@if (loading()) {
  <p>Loading...</p>
} @else {
  <table class="data-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Roles</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.firstName }} {{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.roles.join(", ") }}</td>
          <td>
            <span class="status-pill" [class]="user.enabled ? 'CONFIRMED' : 'CANCELLED'">
              {{ user.enabled ? "Active" : "Disabled" }}
            </span>
          </td>
          <td>
            <button type="button" class="link-btn" (click)="toggleStatus(user)">
              {{ user.enabled ? "Disable" : "Re-enable" }}
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
