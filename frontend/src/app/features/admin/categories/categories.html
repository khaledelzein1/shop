<div class="admin-header">
  <h1>Catégories</h1>
  <button type="button" class="btn" (click)="startCreate()">+ Nouvelle catégorie</button>
</div>

@if (errorMessage()) {
  <div class="alert alert--error">{{ errorMessage() }}</div>
}

@if (editingId() !== null) {
  <form [formGroup]="form" (ngSubmit)="submit()" class="card admin-form">
    <div class="form-field">
      <label for="name">Nom</label>
      <input id="name" type="text" formControlName="name" />
    </div>
    <div class="form-field">
      <label for="slug">Slug</label>
      <input id="slug" type="text" formControlName="slug" placeholder="ex: informatique" />
    </div>
    <div class="form-field">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" rows="2"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Enregistrer</button>
      <button type="button" class="btn btn--secondary" (click)="cancel()">Annuler</button>
    </div>
  </form>
}

@if (loading()) {
  <p>Chargement...</p>
} @else {
  <table class="data-table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Slug</th>
        <th>Description</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (cat of categories(); track cat.id) {
        <tr>
          <td>{{ cat.name }}</td>
          <td>{{ cat.slug }}</td>
          <td>{{ cat.description }}</td>
          <td>
            <button type="button" class="link-btn" (click)="startEdit(cat)">Modifier</button>
            <button type="button" class="link-btn link-btn--danger" (click)="delete(cat.id)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
