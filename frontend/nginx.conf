server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy vers le backend : le frontend appelle toujours /api en
    # relatif (voir environment.prod.ts), nginx route vers le service Docker.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers hashés par le build Angular : cache long, sans risque puisque
    # le nom change à chaque nouveau contenu.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Routing côté client (Angular Router) : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
